name: GymPlan web (iPhone)

# Compila la version web de GymPlan y la publica en la rama gh-pages.
# Para verla en https://<usuario>.github.io/<repo>/ hay que activar GitHub Pages
# (Settings -> Pages -> Deploy from a branch -> gh-pages / root). En cuentas
# gratuitas, GitHub Pages requiere que el repositorio sea publico.

on:
  push:
    paths:
      - 'gym-app/**'
      - '.github/workflows/gym-app-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gym-app-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gym-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Publicar en la rama gh-pages
        working-directory: gym-app/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publicar GymPlan web (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
